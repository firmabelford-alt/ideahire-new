name: Connect Sorts once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  connect-sorts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect Sorts.jsx to router.jsx
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/router.jsx")
          text = path.read_text(encoding="utf-8")

          import_line = 'import Sorts from "./Sorts";'
          import_anchor = 'import App from "./App";'

          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Nie znaleziono importu App w router.jsx")
              text = text.replace(
                  import_anchor,
                  import_anchor + "\n" + import_line,
                  1,
              )

          render_anchor = '''      <AuthProvider>\n        <Routes>'''
          render_replacement = '''      <AuthProvider>\n        <Sorts />\n        <Routes>'''

          if '<Sorts />' not in text:
              if render_anchor not in text:
                  raise SystemExit("Nie znaleziono miejsca do podpięcia Sorts w Routerze")
              text = text.replace(
                  render_anchor,
                  render_replacement,
                  1,
              )

          path.write_text(text, encoding="utf-8")

      - name: Commit router change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/connect-sorts-once.yml
          git add src/router.jsx
          git commit -m "Connect Sorts.jsx to router"
          git push
