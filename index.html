<!doctype html>
<html lang="pl" data-ih-boot="loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IdeaHire — prosta i nowoczesna platforma." />
    <title>IdeaHire</title>
    <script>
      (function () {
        var page = document.documentElement;
        try {
          page.dataset.theme = localStorage.getItem('ideahire_theme') === 'dark' ? 'dark' : 'light';
          page.dataset.template = localStorage.getItem('ideahire_template') === 'classic' ? 'classic' : 'current';
          page.dataset.language = localStorage.getItem('ideahire_language') === 'en' ? 'en' : 'pl';
        } catch (_) { page.dataset.theme = 'light'; page.dataset.template = 'current'; page.dataset.language = 'pl'; }
        page.style.colorScheme = page.dataset.theme;
        page.lang = page.dataset.language;
      }());
    </script>
    <link rel="icon" type="image/svg+xml" href="/brand/ideahire-mark.svg" />
    <link rel="stylesheet" href="/headings.css?v=20261023-3" />
    <link rel="stylesheet" href="/src/Brand.css" />
  </head>
  <body>
    <div id="ih-brand-boot" data-state="loading" role="status" aria-label="IdeaHire" aria-live="polite">
      <div class="ih-boot-panel ih-boot-top" aria-hidden="true"></div>
      <div class="ih-boot-panel ih-boot-bottom" aria-hidden="true"></div>
      <div class="ih-boot-core">
        <span class="ih-brand-signature" role="img" aria-label="IdeaHire"><svg class="ih-brand-mark" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true" focusable="false"><path class="ih-brand-dot" d="M8 8H22V20H8Z"/><path class="ih-brand-join" d="M42 8H50L56 14V56H42V42H22V56H8V28H42Z"/></svg><span class="ih-brand-wordmark" aria-hidden="true">IdeaHire</span></span>
        <span class="ih-boot-label"><span data-boot-pl>Otwieramy IdeaHire</span><span data-boot-en>Opening IdeaHire</span></span>
        <span class="ih-boot-track" aria-hidden="true"><i></i></span>
        <div class="ih-boot-error"><p><span data-boot-pl>Ładowanie trwa dłużej niż zwykle.</span><span data-boot-en>This is taking longer than usual.</span></p><button type="button" data-boot-retry><span data-boot-pl>Odśwież stronę</span><span data-boot-en>Reload page</span></button><button type="button" data-boot-continue><span data-boot-pl>Pokaż stronę</span><span data-boot-en>Show page</span></button></div>
      </div>
      <div class="ih-boot-seam" aria-hidden="true"></div>
    </div>
    <div id="root" inert aria-hidden="true" aria-busy="true"></div>
    <script>
      (function () {
        window.__ihBootStarted = performance.now();
        if (location.pathname !== '/') {
          document.getElementById('ih-brand-boot').style.setProperty('display', 'none', 'important');
          var root = document.getElementById('root');
          root.removeAttribute('inert');
          root.removeAttribute('aria-hidden');
          root.removeAttribute('aria-busy');
          document.documentElement.removeAttribute('data-ih-boot');
        }

        function stalled() {
          var boot = document.getElementById('ih-brand-boot');
          if (boot && boot.dataset.state === 'loading') boot.dataset.state = 'error';
        }
        window.__ihBootWatchdog = setTimeout(stalled, 20000);
        document.querySelector('[data-boot-retry]').addEventListener('click', function () { location.reload(); });
        document.querySelector('[data-boot-continue]').addEventListener('click', function () {
          if (window.__ihBrandReady || document.getElementById('root').children.length) return;
          var boot = document.getElementById('ih-brand-boot');
          if (boot) boot.querySelector('[data-boot-continue]').hidden = true;
        });
        window.addEventListener('error', function (event) {
          if (event.target && event.target.tagName === 'SCRIPT' && event.target.type === 'module') stalled();
        }, true);
      }());
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <noscript><style>#ih-brand-boot{display:none!important}html[data-ih-boot] body{overflow:auto!important}</style><main style="max-width:38rem;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif"><h1>IdeaHire</h1><p>Włącz JavaScript, aby korzystać z platformy. / Enable JavaScript to use IdeaHire.</p><a href="/help/index.html">Centrum pomocy / Help centre</a></main></noscript>
  </body>
</html>
